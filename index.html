<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verben mit Präpositionen · B2/C1</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#162b30;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}header{background:#123e42;color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}header h1{font-size:clamp(1.55rem,3.5vw,2.25rem);margin:6px 0}header p{color:#c8e3df;margin:0}main{max-width:1000px;margin:auto;padding:20px;display:grid;grid-template-columns:235px 1fr;gap:22px}nav{align-self:start;position:sticky;top:16px;background:white;border-radius:14px;padding:12px;box-shadow:0 2px 15px #123e4210}nav button{display:block;width:100%;margin:3px 0;text-align:left;border:0;background:transparent;border-radius:9px;padding:12px;font-size:0.95rem;cursor:pointer;color:#173b40}nav button.active{background:#d9eeea;font-weight:700}section{background:white;border-radius:16px;padding:clamp(18px,3vw,32px);box-shadow:0 2px 15px #123e4210;min-width:0}h2{margin-top:0}p{line-height:1.55}.muted{color:#587176}.pill{display:inline-block;background:#e6f2ef;border-radius:20px;padding:4px 10px;font-size:.82rem}.verb{border:1px solid #dce9e6;border-radius:10px;margin:8px 0;overflow:hidden}.verb summary{padding:13px 15px;cursor:pointer;font-weight:650}.verb div{padding:0 15px 14px}.verb p{margin:7px 0}.question{border-top:1px solid #e1eae8;padding:19px 0}.question label{font-weight:600;display:block;margin-bottom:9px;line-height:1.6}.question input{font:inherit;border:1.5px solid #a6bab7;border-radius:8px;padding:12px;width:min(100%,370px)}.question input:focus{outline:3px solid #a4e2d3;border-color:#126f63}.feedback{margin-top:9px;font-size:.93rem}.good{color:#0b7454}.bad{color:#a44627}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button.action{border:0;border-radius:9px;background:#116e66;color:white;padding:12px 16px;font-weight:650;cursor:pointer}button.secondary{background:#e7f1ef;color:#184d4a}button:focus-visible{outline:3px solid #d99131;outline-offset:2px}.progress{height:9px;background:#e3eeeb;border-radius:10px;overflow:hidd "prep": "von + Dativ", "object": "Wir gehen von der Annahme aus.", "da": "Wir gehen davon aus, dass der Plan funktioniert.", "thing": "Wovon geht ihr aus?", "person": null}, {"verb": "sich beziehen", "prep": "auf + Akkusativ", "object": "Ich beziehe mich auf den Vorschlag.", "da": "Ich beziehe mich darauf, was Sie gesagt haben.", "thing": "Worauf beziehen Sie sich?", "person": "Auf wen bezieht sich deine Frage?"}], "modules": [{"title": "Präposition + Kasus", "desc": "Ergänzen Sie die fehlende Präposition und den bestimmten Artikel. Schreiben Sie zum Beispiel „auf das“ (oder: „aufs“), „mit der“ oder „von den“.", "questions": [{"pre": "Ob das Projekt erfolgreich wird, hängt ", "post": " Budget ab.", "answers": ["von dem", "vom"], "hint": "abhängen von + Dativ; Budget: das", "type": ""}, {"pre": "Wir beschäftigen uns gerade ", "post": " wichtigsten Auswirkungen künstlicher Intelligenz.", "answers": ["mit den"], "hint": "sich beschäftigen mit + Dativ Plural", "type": ""}, {"pre": "Bitte konzentrieren Sie sich ", "post": " wesentliche Argument.", "answers": ["auf das", "aufs"], "hint": "sich konzentrieren auf + Akkusativ; Argument: das", "type": ""}, {"pre": "Ich zweifle ", "post": " Zuverlässigkeit dieser Quelle.", "answers": ["an der"], "hint": "zweifeln an + Dativ; Zuverlässigkeit: die", "type": ""}, {"pre": "Regelmäßiges Feedback trägt ", "post": " Verbesserung der Zusammenarbeit bei.", "answers": ["zu der", "zur"], "hint": "beitragen zu + Dativ; Verbesserung: die", "type": ""}, {"pre": "Ich freue mich ", "post": " bevorstehende Gespräch.", "answers": ["auf das", "aufs"], "hint": "sich freuen auf + Akkusativ; Gespräch: das", "type": ""}, {"pre": "Die Ergebnisse haben uns ", "post": " Wirksamkeit der Methode überzeugt.", "answers": ["von der"], "hint": "überzeugen von + Dativ; Wirksamkeit: die", "type": ""}, {"pre": "Unser Team arbeitet seit Monaten ", "post": " neuen Konzept.", "answers": ["an dem", "am"], "hint": "arbeiten an + Dativ; Konzept: das", "type": ""}, {" eis", "type": "Vorausverweis"}, {"pre": "Die gesellschaftlichen Folgen dieser Technologie werden oft unterschätzt. Wir sollten uns intensiver ", "post": " auseinandersetzen.", "answers": ["damit"], "hint": "sich auseinandersetzen mit · Rückverweis", "type": "Rückverweis"}, {"pre": "Bitte konzentrieren Sie sich ", "post": " , die wichtigsten Argumente herauszuarbeiten.", "answers": ["darauf"], "hint": "sich konzentrieren auf · Vorausverweis", "type": "Vorausverweis"}, {"pre": "Ich zweifle ", "post": " , dass diese Lösung langfristig funktioniert.", "answers": ["daran"], "hint": "zweifeln an · Vorausverweis", "type": "Vorausverweis"}, {"pre": "In dem Bericht werden mehrere Risiken genannt. Die Expertin weist ausdrücklich ", "post": " hin.", "answers": ["darauf"], "hint": "hinweisen auf · Rückverweis", "type": "Rückverweis"}, {"pre": "Regelmäßiges Feedback trägt ", "post": " bei, dass die Zusammenarbeit besser funktioniert.", "answers": ["dazu"], "hint": "beitragen zu · Vorausverweis", "type": "Vorausverweis"}, {"pre": "Ich freue mich ", "post": " , Sie persönlich kennenzulernen.", "answers": ["darauf"], "hint": "sich freuen auf · Vorausverweis", "type": "Vorausverweis"}, {"pre": "Die Kosten werden im nächsten Jahr vermutlich steigen. Bei unserer Planung gehen wir jedenfalls ", "post": " aus.", "answers": ["davon"], "hint": "ausgehen von · Rückverweis", "type": "Rückverweis"}, {"pre": "Die Ergebnisse haben mich ", "post": " überzeugt, dass die Methode wirksam ist.", "answers": ["davon"], "hint": "überzeugen von · Vorausverweis", "type": "Vorausverweis"}, {"pre": "Unser Team arbeitet ", "post": " , ein neues Konzept zu entwickeln.", "answers": ["daran"], "hint": "arbeiten an · Vorausverweis", "type": "Vorausverweis"}, {"pre": "Sie haben vorhin einen interessanten Vorschlag gemacht. Ich möchte mich noch einmal ", "post": " beziehen.", "answers": ["darauf"], "hint": "sich beziehen auf · Rückverweis", "type": "Rückverweis"}, {"pre": "Sie bereitet sich ", "post": " vor, vor überzeugen von · Perfekt · Partizip II: überzeugt", "type": "Perfekt"}, {"pre": "Das Team hat mehrere Monate an der Lösung ", "post": " .", "answers": ["gearbeitet"], "hint": "arbeiten an · Perfekt · Partizip II: gearbeitet", "type": "Perfekt"}, {"pre": "Sie hat sich gründlich auf das Vorstellungsgespräch ", "post": " .", "answers": ["vorbereitet"], "hint": "sich vorbereiten auf · Perfekt · trennbares Verb", "type": "Perfekt"}, {"pre": "Die Organisation hat sich jahrelang für bessere Arbeitsbedingungen ", "post": " .", "answers": ["eingesetzt"], "hint": "sich einsetzen für · Perfekt · trennbares Verb", "type": "Perfekt"}, {"pre": "In schwierigen Situationen ", "post": " ich mich immer auf meine Kolleg:innen.", "answers": ["verließ"], "hint": "sich verlassen auf · Präteritum · ich verließ mich", "type": "Präteritum"}, {"pre": "Wir haben uns ausführlich mit den unterschiedlichen Positionen ", "post": " .", "answers": ["auseinandergesetzt"], "hint": "sich auseinandersetzen mit · Perfekt", "type": "Perfekt"}, {"pre": "Die Expertin ", "post": " auf die Risiken hin.", "answers": ["wies"], "hint": "hinweisen auf · Präteritum · sie wies hin", "type": "Präteritum"}, {"pre": "Wir ", "post": " zunächst davon aus, dass die Kosten sinken würden.", "answers": ["gingen"], "hint": "ausgehen von · Präteritum · wir gingen aus", "type": "Präteritum"}, {"pre": "In meiner Antwort habe ich mich auf Ihren Vorschlag ", "post": " .", "answers": ["bezogen"], "hint": "sich beziehen auf · Perfekt · Partizip II: bezogen", "type": "Perfekt"}, {"pre": "Ich ", "post": " mich sehr auf eine Zusammenarbeit mit Ihnen freuen.", "answers": ["würde"], "hint": "sich freuen auf · Konjunktiv II · würde + Infinitiv", "type": "Konjunktiv II"}, {"pre": "Das Ergebnis ", "post": " davon abhängen, wie wir die Aufgaben verteilen.", "answers": ["würde"], "hint": "abhängen von · Konjunktiv II · würde + Infinitiv", "type": "Konjunktiv II"}]}]};
let current=-1;const state=DATA.modules.map(m=>({answers:Array(m.questions.length).fill(''),checked:false,solutions:false}));const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return s.trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ')}function correct(q,s){return q.answers.some(a=>norm(a)===norm(s))}function renderNav(){let items=['Startseite',...DATA.modules.map((m,i)=>`Modul ${i+1}: ${m.title}`)];$('#nav').innerHTML=items.map((t,i)=>`<button type="button" class="${current===i-1?'active':''}" data-nav="${i-1}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.nav;render();window.scrollTo({top:0,behavior:'instant'})}))}function renderHome(){let out='<h2>15 Verben entdecken</h2><p>Viele deutsche Verben verlangen eine feste Präposition mit einem bestimmten Kasus. Die Beispiele zeigen Präpositionalobjekte, da(r)-Komposita und Fragen nach Sachen und Personen.</p><div class="note"><b>Beispiel:</b> sich beschäftigen <b>mit + Dativ</b><br>Wir beschäftigen uns <b>mit dem Problem</b>.<br>Wir beschäftigen uns <b>damit, wie</b> das Problem entstanden ist.<br><b>Womit</b> beschäftigt ihr euch? / <b>Mit wem</b> beschäftigt ihr euch?</div><p class="muted">Klicken Sie auf ein Verb, um die Beispiele zu öffnen. Sie können während der Übungen jederzeit hierher zurückkehren.</p>';DATA.verbs.forEach(v=>{out+=`<details class="verb"><summary>${esc(v.verb)} · ${esc(v.prep)}</summary><div><p><b>Präpositionalobjekt:</b> ${esc(v.object)}</p><p><b>da(r)-Kompositum:</b> ${esc(v.da)}</p><p><b>Frage nach einer Sache:</b> ${esc(v.thing)}</p>${v.person?`<p><b>Frage nach einer Person:</b> ${esc(v.person)}</p>`:''}</div></details>`});$('#content').innerHTML=out}
function renderModule(){let m=DATA.modules[current],s=state[current],count=m.questions.filter((q,i)=>correct(q,s.answers[i])).length;let out=`<span class="pill">B2/C1 · 15 Aufgaben</span><h2>Modul ${current+1}: ${esc(m.title)}</h2><p>${esc(m.desc)}</p><div class="progress" role="progressbar" aria-label="Richtige Antworten" aria-valuemin="0" aria-valuemax="15" aria-valuenow="${count}"><div style="width:${count/15*100}%"></div></div><p class="muted">${s.checked?`${count} von 15 richtig. Sie können Antworten korrigieren und erneut prüfen.`:'Tragen Sie Ihre Antworten ein und klicken Sie auf „Antworten prüfen“.'}</p>`;m.questions.forEach((q,i)=>{let ok=correct(q,s.answers[i]);out+=`<div class="question"><label for="q${i}">${i+1}. ${esc(q.pre)}<b>_____</b>${esc(q.post)}</label>${q.type?`<span class="pill">${esc(q.type)}</span> `:''}<input id="q${i}" autocomplete="off" spellcheck="false" value="${esc(s.answers[i])}" aria-label="Antwort zu Aufgabe ${i+1}"><div class="feedback" id="f${i}">${s.checked?(ok?'<span class="good">✓ Richtig!</span>':`<span class="bad">Noch nicht richtig.</span> ${s.solutions?`Lösung: <b>${esc(q.answers[0])}</b>. `:''}${esc(q.hint)}`):''}</div></div>`});out+='<div class="buttons"><button class="action" id="check">Antworten prüfen</button><button class="action secondary" id="show">Lösungen anzeigen</button><button class="action secondary" id="reset">Neu beginnen</button></div>';$('#content').innerHTML=out;m.questions.forEach((q,i)=>$('#q'+i).addEventListener('input',e=>{s.answers[i]=e.target.value;s.checked=false;s.solutions=false;$('#f'+i).textContent=''}));$('#check').onclick=()=>{s.checked=true;s.solutions=false;renderModule()};$('#show').onclick=()=>{s.checked=true;s.solutions=true;renderModule()};$('#reset').onclick=()=>{state[current]={answers:Array(m.questions.length).fill(''),checked:false,solutions:false};renderModule()}}
function render(){renderNav();if(current===-1)renderHome();else renderModule()}render();</script></body></html>
